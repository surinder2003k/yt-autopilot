name: Normal Video (7-15 min) every 12h

on:
  schedule:
    - cron: "30 */12 * * *"   # every 12h, :30 past the hour
  workflow_dispatch: {}

jobs:
  normal-video:
    name: Generate & Upload Long-Form Normal Video (7-15 min)
    runs-on: ubuntu-latest
    env:
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EDGE_TTS_TIMEOUT: 180
    steps:
      - name: Checkout (with automation state)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create data volume from repo
        run: |
          mkdir -p /tmp/norm-data
          cp history.json /tmp/norm-data/history.json
          cp automation_state.json /tmp/norm-data/automation_state.json 2>/dev/null || echo "{}" > /tmp/norm-data/automation_state.json
          docker volume create norm-data >/dev/null || true
          docker run --rm -v norm-data:/data -v /tmp/norm-data:/src alpine sh -c "cp /src/history.json /data/ 2>/dev/null; cp /src/automation_state.json /data/ 2>/dev/null; ls -la /data"

      - name: Run normal video generator
        run: |
          docker run --rm \
            -e PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -e YT_REFRESH_TOKEN="${{ secrets.YT_REFRESH_TOKEN }}" \
            -e YT_CLIENT_ID="${{ secrets.YT_CLIENT_ID }}" \
            -e YT_CLIENT_SECRET="${{ secrets.YT_CLIENT_SECRET }}" \
            -e HUGGINGFACE_API_TOKEN="${{ secrets.HUGGINGFACE_API_TOKEN }}" \
            -e EDGE_TTS_TIMEOUT="180" \
            -v norm-data:/data \
            -v ${{ github.workspace }}:/app/repo \
            harishkumar01/money-printer-turbo:runner \
            bash -lc "cp -r /app/repo/* /app/MoneyPrinterTurbo/ 2>/dev/null; cd /app/MoneyPrinterTurbo; cp /data/automation_state.json ./automation_state.json 2>/dev/null || true; python normal_video.py"

      - name: Persist automation state + history back to repo
        if: always()
        run: |
          docker run --rm -v norm-data:/data -v ${{ github.workspace }}:/app/repo alpine sh -c "cp /data/automation_state.json /app/repo/automation_state.json 2>/dev/null; cp /data/history.json /app/repo/history.json 2>/dev/null; true"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation_state.json history.json
          git commit -m "chore: update automation state + history (normal video run)" || echo "no changes"
          git push || echo "push failed"
