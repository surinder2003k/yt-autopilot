name: Normal Video (7-15 min) every 12h

on:
  schedule:
    - cron: "30 */12 * * *"   # every 12h, :30 past the hour
  workflow_dispatch: {}

jobs:
  normal-video:
    name: Generate & Upload Long-Form Normal Video (7-15 min)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ENABLE_TTS: "true"
      TTS_PROVIDER: "edge"
      TTS_VOICE: "en-US-ChristopherNeural"
      RESOLUTION: "1080P"
      EDGE_TTS_TIMEOUT: "180"
      DOCKER_BUILDKIT: "1"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_PROJECT_ID: ${{ secrets.YOUTUBE_PROJECT_ID }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      HISTORY_FILE: /data/history.json
      STATE_FILE: /data/normal_state.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local, no external pull)
        run: docker build -f Dockerfile.cron -t autopilot-normal .

      - name: Create data volume
        run: docker volume create yt-autopilot-data

      - name: Copy current history + normal state into volume
        run: |
          docker run --rm -v yt-autopilot-data:/data -v "$PWD":/repo alpine sh -c '
            if [ -f /repo/history.json ]; then cp /repo/history.json /data/history.json; fi
            if [ -f /repo/normal_state.json ]; then cp /repo/normal_state.json /data/normal_state.json; fi
          '

      - name: Run normal video generator
        run: |
          docker run --rm \
            -v yt-autopilot-data:/data \
            -e PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e YOUTUBE_CLIENT_SECRET="${{ secrets.YOUTUBE_CLIENT_SECRET }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -e LLM_PROVIDER="${{ secrets.LLM_PROVIDER }}" \
            -e LLM_MODEL="${{ secrets.LLM_MODEL }}" \
            -e ENABLE_TTS="true" \
            -e TTS_PROVIDER="edge" \
            -e TTS_VOICE="en-US-ChristopherNeural" \
            -e RESOLUTION="1080P" \
            -e EDGE_TTS_TIMEOUT="180" \
            -e YOUTUBE_CLIENT_ID="${{ secrets.YOUTUBE_CLIENT_ID }}" \
            -e YOUTUBE_PROJECT_ID="${{ secrets.YOUTUBE_PROJECT_ID }}" \
            -e YOUTUBE_REFRESH_TOKEN="${{ secrets.YOUTUBE_REFRESH_TOKEN }}" \
            -e YOUTUBE_CLIENT_SECRET_JSON="${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" \
            -e HISTORY_FILE=/data/history.json \
            -e STATE_FILE=/data/normal_state.json \
            -e MAIN_SCRIPT=normal_video.py \
            autopilot-normal

      - name: Persist history + state back to repo
        if: always()
        run: |
          docker run --rm -v yt-autopilot-data:/data -v "$PWD":/repo alpine sh -c '
            if [ -f /data/history.json ]; then cp /data/history.json /repo/history.json; fi
            if [ -f /data/normal_state.json ]; then cp /data/normal_state.json /repo/normal_state.json; fi
          '
          git config user.name "autopilot-bot"
          git config user.email "bot@noreply.local"
          git add history.json normal_state.json
          git commit -m "chore: update history + normal state [skip ci]" || echo "nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/surinder2003k/yt-autopilot.git HEAD:main || echo "push failed"
